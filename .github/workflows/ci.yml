name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -v -s tests -p 'test_*.py'
      - name: Check Python syntax
        run: python -m compileall -q gatekeeper plugin tests

  go:
    name: Go tests and vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.22.x"
          cache-dependency-path: router/go.mod
      - name: Run race-enabled tests
        working-directory: router
        run: go test -race ./...
      - name: Run go vet
        working-directory: router
        run: go vet ./...
      - name: Build router
        working-directory: router
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./...
